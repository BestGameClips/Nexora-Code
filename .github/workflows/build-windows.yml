name: build-windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: npx tauri icon app-icon.png
      - run: npx tauri build --no-bundle
      - name: Dossier portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable | Out-Null
          Copy-Item src-tauri/target/release/rustide.exe portable/
          New-Item portable/portable.flag -ItemType File | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: rustide-portable-windows
          path: portable
